# Google recommends a relaxed referrer policy only for HTTP loopback development.
map "$scheme:$host" $google_referrer_policy {
  default strict-origin-when-cross-origin;
  "http:localhost" no-referrer-when-downgrade;
  "http:127.0.0.1" no-referrer-when-downgrade;
}

server {
  listen 80;
  include /etc/nginx/quizflow-locations.conf;
}
