# QuizFlow — toute la plateforme en une commande :  docker compose up --build
# Puis ouvrir http://localhost:3000
# Pour développer, ne lancer que les bases et l'IA :  docker compose up postgres mongo ai-service

services:
  postgres:
    # PostgreSQL 16 + extension pgvector (recherche vectorielle du RAG).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quizflow
      POSTGRES_USER: quizflow
      POSTGRES_PASSWORD: quizflow
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizflow -d quizflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # RAG : bibliothèque de PDF (schéma « rag » de la même base PostgreSQL).
      DATABASE_URL: postgresql://quizflow:quizflow@postgres:5432/quizflow
      # Secret partagé avec le backend : seul lui peut appeler le service IA.
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-dev-internal-token-change-me}
    volumes:
      # Modèle d'embeddings (~500 Mo) gardé entre les reconstructions : téléchargé une seule fois.
      - ai-models:/models
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quizflow
      DB_USER: quizflow
      DB_PASSWORD: quizflow
      MONGO_URI: mongodb://mongo:27017/quizflow
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me-0123456789}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-dev-internal-token-change-me}
      # En local, les codes de confirmation s'affichent dans les logs du backend (APP_MAIL_MODE=log).
      # Mettre APP_MAIL_MODE=smtp dans .env et configurer le SMTP pour envoyer de vrais emails.
      APP_MAIL_MODE: ${APP_MAIL_MODE:-log}
      APP_EMAILVERIFICATION_HMACKEY: ${APP_EMAILVERIFICATION_HMACKEY:-}
      APP_EMAILVERIFICATION_FROM: ${APP_EMAILVERIFICATION_FROM:-no-reply@quizflow.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pg-data:
  mongo-data:
  ai-models:
